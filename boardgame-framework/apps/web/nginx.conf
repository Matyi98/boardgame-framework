server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # index.html must never be cached — it references hashed asset filenames that
  # change on every build, so stale index.html = stale JS/CSS bundle loaded.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    expires 0;
  }

  # SPA fallback — all unmatched routes go to index.html so React Router can handle them.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    expires 0;
  }

  # Long cache for fingerprinted assets (hash in filename = safe forever).
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
